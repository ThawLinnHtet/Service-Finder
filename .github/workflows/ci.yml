name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/service_finder_test
      JWT_ACCESS_SECRET: ci_access_secret_12345678901234567890
      JWT_REFRESH_SECRET: ci_refresh_secret_12345678901234567890
      MAPBOX_ACCESS_TOKEN: ci-mapbox-token
      CLOUDINARY_CLOUD_NAME: ci-cloud
      CLOUDINARY_API_KEY: ci-key
      CLOUDINARY_API_SECRET: ci-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Typecheck backend
        run: npm run build

      - name: Test backend
        run: npm test -- --runInBand

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_PUBLIC_MAPBOX_TOKEN: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck and build frontend
        run: npm run build

  duplicate-code:
    name: Duplicate Code Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check duplicate code
        run: |
          npx jscpd@latest \
            --threshold 5 \
            --min-lines 8 \
            --min-tokens 50 \
            --ignore "**/node_modules/**,**/dist/**,**/.next/**,**/coverage/**,backend/src/generated/**" \
            "backend/src/**/*.ts" \
            "frontend/**/*.{ts,tsx}"
